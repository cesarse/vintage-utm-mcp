[project]
name = "vintage-utm-mcp"
version = "0.1.0"
description = "MCP server to control UTM virtual machines (retro-OS friendly: MS-DOS, OS/2, Windows 3.x)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2,<3",
    "qemu.qmp>=0.0.3",
    "pillow>=10",
]

[project.scripts]
vintage-utm-mcp = "vintage_utm_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "mcp[cli]>=2,<3",  # inspector: `uv run mcp dev src/vintage_utm_mcp/server.py`
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vintage_utm_mcp"]
